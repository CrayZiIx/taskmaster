# Taskmaster configuration example.
# Empty output paths inherit the daemon's stdout and stderr.
taskmaster:
  echo:
    cmd: ["/bin/echo", "hello from taskmaster"]
    workdir: ""
    umask: "022"
    process-nb: 1
    env:
      APP_ENV: "prod"
    output:
      stdout: ""
      stderr: ""
    journey:
      autostart: false
      health-time: 1000
      restart-policy:
        restart-case: "never"
        restart-nb: 0
      exit:
        code: [0]
        signal: ["SIGTERM"]
        timeout-ms: 5000

  sleep:
    cmd: ["/bin/sleep", "10"]
    workdir: ""
    umask: "022"
    process-nb: 1
    output:
      stdout: "/dev/null"
      stderr: "/dev/null"
    journey:
      autostart: true
      health-time: 1000
      restart-policy:
        restart-case: "unexpected"
        restart-nb: 3
      exit:
        code: [0]
        signal: ["SIGTERM"]
        timeout-ms: 5000
